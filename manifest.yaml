# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
#
# Replace everything below with your own app. The example describes a small
# "days until" app so you can see the shape of each part.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# EMPTY ON PURPOSE. Claude asks you for it before anything else, and nothing
# publishes until it is filled in (the build says "Nothing to publish yet").
#
# It is the name everybody sees next to your app: "by <name>" on the install
# screen, in the list of apps and on every answer your app gives. So it is
# PUBLIC, and it should be a pseudonym: a made-up name or a nickname, never
# your real name and never an email address. This repository is public too,
# so anyone can read it here as well.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "Ximin Li"

app:
  # Filled in for you. A new repository replaces this placeholder within a
  # minute of being created, from the repository's name, and commits it as
  # github-actions[bot] (.github/workflows/setup.yml). Until then the build
  # publishes nothing.
  #
  # It must be `hack.` + this repository's name with `pippa-hack-` removed and
  # every hyphen turned into an underscore:
  #
  #     Pippa-Labs/pippa-hack-tide-times  ->  hack.tide_times
  #
  # Hyphens are not valid in an app id anywhere. `git remote get-url origin`
  # tells you the repository name.
  id: hack.app_c510
  name: Module Navigator
  # The version you are pushing. Bump it after a version is submitted for
  # review: a submitted version is frozen.
  version: 0.2.0
  # Never use the word "by" here: the badge is parsed on it.
  summary: >-
    Looks up prerequisites, follow-on modules, option rules and module
    suggestions for a career or research interest, for Imperial College
    Mathematics and Computing degrees. Built from the published 2026-27 module
    guides; unofficial and sends nothing anywhere, so confirm choices with
    your department.

agent_types:
  - personal

outcomes:
  - id: modules.prerequisites
    summary: Say which modules are essential or useful to have taken before a given module
    example_phrases:
      - what are the prerequisites for this module
      - what do i need before taking
      - prereqs for galois theory
      - can i take functional analysis without lebesgue
      - what should i study first for quantum mechanics
      - is groups and rings required for
      - which year 2 courses does it assume
    inputs:
      - name: module
        type: string
        required: false
        description: >-
          The university module the user is asking about, exactly as they
          wrote it: a code such as "MATH60028" or "60028", or a title such as
          "Probability Theory 1" or "fluids 2". Return an empty string if no
          module is named, rather than guessing.
    output:
      - name: module
        type: string
        description: The module's code, title and year of study.
      - name: academic_year
        type: string
        description: The academic year the data comes from, e.g. 2026-27.
      - name: term
        type: string
        description: The term or terms it is taught in.
      - name: ects
        type: number
      - name: essential
        type: array
        item_type: string
        description: Modules the guide calls essential beforehand.
      - name: useful
        type: array
        item_type: string
        description: Modules the guide calls useful or recommended beforehand.
      - name: excluded_with
        type: array
        item_type: string
        description: Modules that cannot be taken alongside it.
      - name: notes
        type: string
        required: false

  - id: modules.unlocks
    summary: Say which later modules build on a given module, so what it opens up
    example_phrases:
      - what does this module lead on to
      - what can i take after
      - which courses does it unlock
      - if i do applied pdes what opens up
      - what builds on probability for statistics
      - is it worth taking for later years
    inputs:
      - name: module
        type: string
        required: false
        description: >-
          The university module the user has taken or is considering, as they
          wrote it: a code such as "MATH50006" or a title such as "Lebesgue
          Measure and Integration". Return an empty string if no module is
          named, rather than guessing.
    output:
      - name: module
        type: string
        description: The module's code, title and year of study.
      - name: academic_year
        type: string
      - name: essential_for
        type: array
        item_type: string
        description: Later modules that list it as essential.
      - name: useful_for
        type: array
        item_type: string
        description: Later modules that list it as useful.

  - id: modules.options
    summary: List the core and optional modules and choice rules for a maths degree and year
    example_phrases:
      - what electives can i pick in third year
      - which options are available for my degree
      - list the optional modules for maths year 3
      - what are the choice rules for g1g3
      - how many ects do i need to choose
      - which electives run in the spring term
      - second year option modules for pure maths
    inputs:
      - name: degree
        type: string
        required: false
        description: >-
          The user's degree, as they wrote it: a UCAS-style code such as
          "G100" or "G1G3", or a name such as "Maths with Statistics". Return
          an empty string if they did not say, rather than guessing.
      - name: year
        type: integer
        required: false
        description: >-
          The year of study they are choosing for (2 for second year, 3 for
          third year). Leave this out entirely if they did not say.
      - name: term
        type: integer
        required: false
        description: >-
          Only if they asked about one term: 1 for autumn, 2 for spring, 3 for
          summer. Leave this out entirely otherwise.
    output:
      - name: degree
        type: string
        description: The degree code and title the answer is for.
      - name: year
        type: integer
      - name: academic_year
        type: string
      - name: core
        type: array
        item_type: string
      - name: options
        type: array
        item_type: string
      - name: rules
        type: array
        item_type: string
        description: The choice rules for that degree and year, in plain words.

  - id: modules.recommend
    summary: Suggest modules that suit a research interest or career path someone describes
    example_phrases:
      - recommend modules for a career in finance
      - which modules should a future quant study
      - best modules for machine learning research
      - suggest courses for a phd in pure maths
      - what suits someone interested in cryptography
      - good choices for a job in data science
      - i like fluid dynamics what would you recommend
    inputs:
      - name: interests
        type: string
        required: false
        description: >-
          The research interests or career the user describes, in their own
          words, for example "quant finance at a hedge fund", "machine learning
          research" or "climate modelling". Return an empty string if they did
          not describe any, rather than guessing.
      - name: taken
        type: string
        required: false
        description: >-
          Modules the user says they have already taken or are taking, as they
          wrote them, separated by commas, for example "Groups and Rings,
          MATH50010". Return an empty string if they did not mention any.
      - name: degree
        type: string
        required: false
        description: >-
          The user's degree, as they wrote it: a code such as "G100" or "G400",
          or a name such as "Maths with Statistics" or "Computing MEng". Return
          an empty string if they did not say, rather than guessing.
      - name: year
        type: integer
        required: false
        description: >-
          The year of study they are choosing modules for (2 for second year, 3
          for third year, 4 for fourth year). Leave this out entirely if they
          did not say.
    output:
      - name: interests_matched
        type: array
        item_type: string
        description: The subject areas the description was matched to.
      - name: degree
        type: string
      - name: year
        type: integer
      - name: academic_year
        type: string
      - name: recommended
        type: array
        item_type: string
        description: Suggested modules, best match first, with the areas they fit.
      - name: needs_prerequisites
        type: array
        item_type: string
        description: Good matches whose essential prerequisites the user has not taken.
      - name: not_recognised
        type: array
        item_type: string
        required: false
        description: Modules the user listed that are not in the guides.
